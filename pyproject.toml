[project]
name = "evac"
version = "0.1.0"
description = "EVAC - Event and Venue Administration Core: screens, announcements, evacuation information and event operations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "kirikakaese" }]
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-filter>=24.0",
    "django-environ>=0.11",
    "channels>=4.1",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23.0",
    "cryptography>=42.0",
    "pyotp>=2.9",
    "webauthn>=2.0",
    "qrcode[pil]>=7.4",
    "jsonschema>=4.21",
    "requests>=2.31",
    "Markdown>=3.6",
    "gunicorn>=22.0",
    "uvicorn[standard]>=0.30",
    "uvicorn-worker>=0.2",
    "whitenoise>=6.6",
    "Pillow>=11.2",
    "fonttools[woff]>=4.53",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "factory-boy>=3.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.scripts]
evac = "apps.api.cli:main"

# Third-party plugins register themselves under this entry point group (see docs/PLUGIN_SDK.md):
# [project.entry-points."evac.plugins"]
# my_plugin = "my_plugin_package"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "evac*", "extensions*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "evac.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps", "extensions", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps", "extensions", "evac"]
omit = ["*/migrations/*", "*/tests/*", "evac/settings/*", "evac/wsgi.py", "evac/asgi.py"]

[tool.coverage.report]
fail_under = 85
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B904", "B027"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
# Pure-python safety and framework cores are type-checked strictly; the list grows with every phase
# (apps/evacuation joins in Phase 3, see CLAUDE.md).
files = [
    "apps/core/plugins.py",
    "apps/core/registry.py",
    "apps/core/crypto.py",
    "apps/core/hashchain.py",
    "apps/core/settings_schema.py",
    "apps/events/permissions.py",
    "apps/playlists/engine.py",
]
strict = true
