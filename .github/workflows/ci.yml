name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # nightly: dependency audit (load/chaos jobs join in phase 3)

env:
  PYTHON_VERSION: "3.12"
  DEPS_CMD: >-
    python -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb'))['project'];
    print('\n'.join(d['dependencies'] + d['optional-dependencies']['dev']))"

jobs:
  attribution:
    name: attribution check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/check_attribution.py

  test:
    name: lint, types, migrations, tests, a11y, openapi
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evac
          POSTGRES_PASSWORD: evac
          POSTGRES_DB: evac
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evac -d evac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          eval "$DEPS_CMD" > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Ruff
        run: ruff check apps evac extensions conftest.py scripts

      - name: Mypy (strict core modules)
        run: mypy

      - name: Migrations are up to date
        env:
          DJANGO_SETTINGS_MODULE: evac.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with coverage (includes the accessibility checks)
        run: python -m pytest -p no:cacheprovider --cov --cov-report=term --cov-report=xml

      - name: Migrations, seed and deploy checks on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: evac.settings.dev
          DATABASE_URL: postgres://evac:evac@localhost:5432/evac
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci
        run: |
          python manage.py migrate --noinput
          python manage.py evac_seed_demo
          python manage.py evac_audit_verify
          python manage.py evac_a11y
          SECRET_KEY=ci-secret-key-that-is-long-enough-for-django-checks-0123456789 EVAC_SECRETS_KEYS=$(python manage.py evac_genkey) \
            python manage.py check --deploy --settings=evac.settings.prod --fail-level ERROR

      - name: Audit log is append-only on PostgreSQL
        env:
          PGPASSWORD: evac
        run: |
          if psql -h localhost -U evac -d evac -c "UPDATE core_auditlog SET message='x'"; then
            echo "UPDATE on core_auditlog must fail"; exit 1; fi

      - name: OpenAPI schema has no drift
        env:
          DJANGO_SETTINGS_MODULE: evac.settings.test
        run: |
          python manage.py spectacular --file openapi.yaml --validate
          diff -u docs/api/openapi.yaml openapi.yaml

      - name: Dependency audit
        run: pip-audit -r requirements-ci.txt --progress-spinner off || (echo "::warning::pip-audit reported issues"; exit 1)

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-and-openapi
          path: |
            coverage.xml
            openapi.yaml

  frontend:
    name: frontend (types, tests, bundles up to date, size budgets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build (typecheck, bundle, size budget)
        run: npm run build
      - name: Committed bundle matches the sources
        run: git diff --exit-code -- ../static/player ../static/editor || (echo "Run 'make frontend' and commit static/player/ and static/editor/." && exit 1)

  e2e:
    name: browser end-to-end (phase 1 acceptance)
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          eval "$DEPS_CMD" > requirements-ci.txt
          pip install -r requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Pair, design with an uploaded font, publish, override, go offline (and try to escape the code sandbox)
        env:
          E2E_PYTHON: python
          E2E_OUT: ${{ github.workspace }}/e2e-output
        run: E2E_CHROMIUM="$(command -v google-chrome || command -v chromium)" make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-output/

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: evac:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: docker run --rm -e SECRET_KEY=ci -e EVAC_ALLOW_INSECURE=1 -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 evac:ci python manage.py check
      - name: Compose stack comes up and serves the first-run wizard
        run: |
          printf 'SECRET_KEY=ci-compose-%s\nEVAC_SECRETS_KEYS=%s\n' "$(openssl rand -hex 24)" \
            "$(python3 -c 'import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" > .env
          docker compose up -d --wait
          curl -fsS http://localhost:8000/healthz
          curl -fsS -o /dev/null -w "%{redirect_url}\n" http://localhost:8000/ | grep -q "/setup/"
          docker compose down -v
