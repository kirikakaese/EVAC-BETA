  /api/v1/events/{event_slug}/announcements/:
    get:
      operationId: events_announcements_list
      description: |-
        Announcements. Create writes a draft (``send: true`` submits it at once); with a ``template`` its texts
        are filled from ``variables``. ``POST …/submit/``, ``…/approve/``, ``…/reject/``, ``…/cancel/``.
        ``deliveries`` is the delivery report (one row per channel and occurrence).
      parameters:
      - in: path
        name: event_slug
        schema:
          type: string
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - draft
          - ended
          - live
          - pending
          - rejected
          - scheduled
        description: |-
          * `draft` - Draft
          * `pending` - Waiting for approval
          * `scheduled` - Scheduled
          * `live` - Published
          * `rejected` - Rejected
          * `cancelled` - Cancelled
          * `ended` - Ended
      tags:
      - events
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
    post:
      operationId: events_announcements_create
