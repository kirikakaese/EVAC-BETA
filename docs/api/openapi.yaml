openapi: 3.0.3
info:
  title: EVAC - Event and Venue Administration Core API
  version: 0.1.0
  description: 'REST API for events, venues, roles, modules, extensions and audit.
    Authenticate with a session or `Authorization: Bearer evac_...` service token.'
paths:
