    get:
      operationId: audit_verify_retrieve
      tags:
      - audit
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
