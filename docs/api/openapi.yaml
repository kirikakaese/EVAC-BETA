components:
  schemas:
    AssignRoleRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role:
          type: string
          minLength: 1
          pattern: ^[-a-zA-Z0-9_]+$
        scope_kind:
          type: string
          default: ''
        scope_id:
          type: string
          default: ''
        invite:
          type: boolean
          default: true
          description: Send an invitation if no account exists.
      required:
      - email
      - role
    Assignment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          type: string
          readOnly: true
        scope_kind:
          type: string
          maxLength: 32
        scope_id:
          type: string
          maxLength: 64
        scope_label:
          type: string
          maxLength: 200
      required:
      - id
      - role
    Audit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
        actor_repr:
          type: string
          maxLength: 200
        event_repr:
          type: string
          maxLength: 200
        action:
          type: string
          maxLength: 64
        target_type:
          type: string
          maxLength: 100
        target_id:
          type: string
          maxLength: 64
        target_repr:
          type: string
          maxLength: 300
        scope: {}
        message:
          type: string
          maxLength: 500
        changes: {}
        ip_address:
          type: string
          nullable: true
        drill:
          type: boolean
          description: Action happened as part of a drill.
        prev_hash:
          type: string
          maxLength: 64
        hash:
          type: string
          maxLength: 64
      required:
      - action
      - hash
      - id
      - prev_hash
    Building:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        venue:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        outdoor:
          type: boolean
          title: Open-air site
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - id
      - name
      - venue
    BuildingRequest:
      type: object
      properties:
        venue:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        outdoor:
          type: boolean
          title: Open-air site
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - name
      - venue
    CloneRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        with_content:
          type: boolean
          default: false
      required:
      - name
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          title: Short name
          description: 'Used in URLs: /e/<short name>/'
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 200
        description:
          type: string
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        timezone:
          type: string
          title: Time zone
          maxLength: 64
        start_date:
          type: string
          format: date
          nullable: true
          title: First day
        end_date:
          type: string
          format: date
          nullable: true
          title: Last day
        venues:
          type: array
          items:
            type: string
        primary_color:
          type: string
          title: Primary colour
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
        accent_color:
          type: string
          title: Accent colour
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
        default_theme:
          type: string
          description: Theme key used by screens (Phase 1 designer).
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - state
      - updated_at
    EventRequest:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
          title: Short name
          description: 'Used in URLs: /e/<short name>/'
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        timezone:
          type: string
          minLength: 1
          title: Time zone
          maxLength: 64
        start_date:
          type: string
          format: date
          nullable: true
          title: First day
        end_date:
          type: string
          format: date
          nullable: true
          title: Last day
        venues:
          type: array
          items:
            type: string
            minLength: 1
        primary_color:
          type: string
          minLength: 1
          title: Primary colour
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
        accent_color:
          type: string
          minLength: 1
          title: Accent colour
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
        default_theme:
          type: string
          description: Theme key used by screens (Phase 1 designer).
          maxLength: 64
      required:
      - name
      - slug
    Floor:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        building:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        level:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 0 = ground floor, negative = basement.
      required:
      - building
      - id
      - name
    FloorRequest:
      type: object
      properties:
        building:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        level:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: 0 = ground floor, negative = basement.
      required:
      - building
      - name
    Membership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignments
      - created_at
      - id
      - user
    ModuleState:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        required:
          type: boolean
          readOnly: true
        instance:
          type: boolean
          readOnly: true
        event:
          type: boolean
          nullable: true
        active:
          type: boolean
          readOnly: true
      required:
      - active
      - description
      - event
      - instance
      - key
      - name
      - required
    PaginatedAuditList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Audit'
    PaginatedBuildingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Building'
    PaginatedEventList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
