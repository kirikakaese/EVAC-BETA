openapi: 3.0.3
info:
  title: EVAC - Event and Venue Administration Core API
  version: 0.1.0
  description: 'REST API for events, venues, roles, modules, extensions and audit.
    Authenticate with a session or `Authorization: Bearer evac_...` service token.'
paths:
  /api/v1/audit/verify/:
    get:
      operationId: audit_verify_retrieve
      tags:
      - audit
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/buildings/:
    get:
      operationId: buildings_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - buildings
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuildingList'
          description: ''
    post:
      operationId: buildings_create
      tags:
      - buildings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuildingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuildingRequest'
        required: true
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
          description: ''
  /api/v1/buildings/{id}/:
    get:
      operationId: buildings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this building.
        required: true
      tags:
      - buildings
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
          description: ''
    put:
      operationId: buildings_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this building.
        required: true
      tags:
      - buildings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuildingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuildingRequest'
        required: true
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
          description: ''
    patch:
      operationId: buildings_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this building.
        required: true
      tags:
      - buildings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBuildingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBuildingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBuildingRequest'
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
          description: ''
    delete:
      operationId: buildings_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this building.
        required: true
      tags:
      - buildings
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/events/:
    get:
      operationId: events_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
          enum:
          - archived
          - draft
          - live
          - setup
          - teardown
        description: |-
          * `draft` - Draft
          * `setup` - Setup
          * `live` - Live
          * `teardown` - Teardown
          * `archived` - Archived
      tags:
      - events
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: events_create
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
  /api/v1/events/{event_slug}/audit/:
    get:
      operationId: events_audit_list
      description: For viewsets nested below /events/<event_slug>/.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: drill
        schema:
          type: boolean
      - in: path
        name: event_slug
        schema:
          type: string
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - events
      security:
      - ServiceToken: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditList'
          description: ''
  /api/v1/events/{event_slug}/audit/{id}/:
