# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "evac-player"
version = "1.0.0"
description = "EVAC screen player: the web player in a full-screen native window"
authors = ["kirikakaese"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
