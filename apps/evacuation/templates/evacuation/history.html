{% extends "base.html" %}{% load i18n %}
{% block title %}{% trans "Evacuation history" %}{% endblock %}
{% block content %}
<div class="page-header"><h1>{% trans "Evacuation history" %}</h1>
<div class="actions"><a class="btn" href="{% url 'evacuation:index' event.slug %}">{% trans "Back" %}</a></div></div>
<nav class="tabs" aria-label="{% trans 'Filter' %}"><a href="?" {% if not filter %}aria-current="page"{% endif %}>{% trans "All" %}</a>
<a href="?drills=none" {% if filter == "none" %}aria-current="page"{% endif %}>{% trans "Real alarms" %}</a>
<a href="?drills=only" {% if filter == "only" %}aria-current="page"{% endif %}>{% trans "Drills" %}</a></nav>
<section class="card">{% include "evacuation/_history.html" %}</section>
{% endblock %}
