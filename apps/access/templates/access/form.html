{% extends "base.html" %}{% load i18n %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ title }}</h1><div class="actions"><a class="btn btn-ghost" href="{{ back }}">{% trans "Back" %}</a></div></div>
<section class="card"><form method="post"{% if files %} enctype="multipart/form-data"{% endif %}>{% csrf_token %}{% include "portal/_form.html" with form=form %}<button class="btn btn-primary">{% trans "Save" %}</button></form></section>
{% endblock %}
