{% load i18n %}{% if ctx.items %}<p class="panel-figures"><b class="tabular">{{ ctx.missing }}</b> {% trans "people needed" %}</p><ul class="plain panel-list">{% for n in ctx.items %}<li><span class="badge {% if n.now %}badge-err{% else %}badge-warn{% endif %}">{{ n.missing }}</span> <a href="{% url 'crew:shift' event.slug n.id %}"><strong>{{ n.title }}</strong></a> <span class="small muted">{{ n.team }} · {{ n.label }}</span></li>{% endfor %}</ul>
{% else %}<p class="muted">✓ {% trans "Every shift has its people." %}</p>{% endif %}<p><a class="btn btn-sm btn-ghost" href="{% url 'crew:index' event.slug %}">{% trans "Shift board" %}</a></p>
